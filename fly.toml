app = "meu-candidato"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  
  [[services.ports]]
    port = 80
  
  [[services.ports]]
    port = 443

[[services.http_checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
