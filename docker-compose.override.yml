services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
    depends_on:
      - api
