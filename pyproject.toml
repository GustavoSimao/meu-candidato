[project]
name = "meu-candidato"
version = "0.1.0"
description = "API para agregação de dados de políticos brasileiros"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.26",
    "pandas>=2.1",
    "polars>=0.19",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.3",
    "mypy>=1.8",
]
ingestion = [
    "pandas>=2.1",
    "polars>=0.19",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*", "alembic*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "TID", "ARG", "PTH", "ERA", "RET", "PL"]
ignore = ["S101", "TID252", "ARG001", "PLR0913", "PLR0917"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
# Windows: usar SelectorEventLoop para psycopg async
asyncio_loop_policy = "asyncio.WindowsSelectorEventLoopPolicy"