app = "meu-candidato-worker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  ENVIRONMENT = "production"

[processes]
  worker = "python -m app.workers.ingestion"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 80

  [[services.ports]]
    port = 443
